<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento</title>
    <link rel="stylesheet" href="/Ejercicios/posicionamiento/css/posicionamiento5.css">
    <link rel="shortcut icon" href="/Ejercicios/posicionamiento/imagenes/iconoWebPosicionamiento.png">
</head>

<style>
    body {
    font-family: Arial, sans-serif;
    min-height: 100vh; /* Asegura que el body ocupe toda la altura de la ventana */
}

h1 {
    color: white;
    text-align: center;
    font-size: 33px;
    padding: 20px;
}

p{
    color: black;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    padding: 20px;
}

div.azul {
    background-color: blue;
    width: 100%;
    height: 30%;
}

div.rojo {
    background-color: red;
    width: 33.33%; 
    height: 400px; 
    float: left;
}

div.verde {
    background-color: green;
    width: 33.33%; 
    height: 400px; 
    float: left;
}

div.amarillo {
    background-color: yellow;
    width: 33.33%; 
    height: 400px;
    float: left;
}

div.naranja {
    background-color: orange;
    width: 100%;
    height: 700px; 
    padding: 400px;

}

div.morado {
    background-color: purple;
    width: 100px; 
    height: 100px; 
    float: right;
    top: 50%; 
    left: 50%;
    transform: translate(-50%, 0);
}


</style>

<body>
    <main>
        <div class="azul">
            <h1 id="inicioPagina">Posicionamiento 5 <p>Azul</p></h1>
        </div>
        
        <!-- Div Gris Sticky debajo del Azul -->
        <div class="gris"></div> 

        <div class="rojo">
            <p>Rojo</p>
        </div>
        <div class="verde">
            <p>Verde</p>
        </div>
        <div class="amarillo">
            <p>Amarillo</p>
        </div>
        <div class="naranja">
            <p>Naranja</p>
        </div>
    </main>

    <div class="morado"></div>



</body>

</html>
