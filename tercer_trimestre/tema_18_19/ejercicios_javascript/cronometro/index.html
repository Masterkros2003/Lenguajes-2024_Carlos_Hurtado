<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Cronómetro JavaScript</title>
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <div class="container">
    <div class="header">Eventos - Cronómetro JavaScript</div>
    <div class="main">
      <div class="tiempo">
        <span>
          <div id="minutos">00</div>
          <label>Minutos</label>
        </span>
        <span>
          <div id="segundos">00</div>
          <label>Segundos</label>
        </span>
        <span>
          <div id="milisegundos">000</div>
          <label>Milisegundos</label>
        </span>
      </div>

      <div class="botones">
        <button onclick="iniciar()">Iniciar</button>
        <button onclick="detener()">Detener</button>
        <button onclick="reiniciar()">Reiniciar</button>
      </div>
    </div>
    <div class="footer">Carlos Hurtado Cánovas</div>
  </div>

  <script src="mains.js"></script>
</body>
</html>
