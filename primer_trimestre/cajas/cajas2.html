<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajas de contenido</title>
    
</head>
<style>
    body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    width: 1200px; /* Ancho máximo del contenido */
    margin: auto; /* Centra el contenido */
}

h1 {
    text-align: center;
    font-size: 24px;
}

.texto {
    text-align: center; 
    height: 100%; 
    width: 100%;
    color: darkblue; 
}

table {
    width: 100%;
    border-spacing: 0 40px; /* Espacio vertical de 20px entre las filas */ 
}

td {
    width: 250px; /* Ancho */
    height: 400px; /* Altura */ 
}

.cuadrado1{
    content: 0;
    padding: 0;
    border: 200px solid red;
    border-top-color: blue;
    border-bottom-color: green;
    border-right-color: yellow;
    width: 0px; /* Ajusta según necesites */
    height: 0px; /* Ajusta según necesites */
}

.cuadrado2{
    content: 0;
    padding: 0;
    border: 200px solid red;
    border-top-color: blue;
    border-bottom-color: green;
    border-right-color: white;
    width: 0px; /* Ajusta según necesites */
    height: 0px; /* Ajusta según necesites */
}

.cuadrado3{
    content: 0;
    padding: 0;
    border: 200px solid white;
    border-top-color: blue;
    border-bottom-color: white;
    border-right-color: white;
    width: 0px; /* Ajusta según necesites */
    height: 0px; /* Ajusta según necesites */
}

.circulo1 {
    background-color: green;
    border-radius: 50%;
    font-size: 24px;
    height: 200px; /* Altura del círculo */
    width: 200px; /* Ancho del círculo */
}

.circulo2 {
    width: 100px;
    height: 100px;
    background-color: green;
    border-radius: 50%;
    clip-path: inset(0 50% 0 0);
}

.circulo3 {
    width: 100px;
    height: 100px;
    background-color: green;
    border-radius: 50%;
    clip-path: inset(50% 0 0 0);
}

</style>

<body>
    <div>
        <h1 id="inicioPagina">CAJA DE CONTENIDO</h1><br>
        <table class="tabla">
            <tr>
                <td>
                    <div class="cuadrado1">
                        <div class="red"></div>
                        <div class="blue"></div>
                        <div class="yellow"></div>
                        <div class="green"></div>
                    </div>
                </td>
                <td class="circulo1">
                    <div>
                        <p></p>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="cuadrado2">
                        <div class="red"></div>
                        <div class="blue"></div>
                        <div class="yellow"></div>
                        <div class="green"></div>
                    </div>
                </td>
                <td class="circulo2">
                    <p></p>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="cuadrado3">
                        <div class="red"></div>
                        <div class="blue"></div>
                        <div class="yellow"></div>
                        <div class="green"></div>
                    </div>
                </td>
                <td class="circulo3">
                    <div>
                        <p></p>
                    </div>
                </td>
            </tr>
        </table>
    </div><br>


</html>
