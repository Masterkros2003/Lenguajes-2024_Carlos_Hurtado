<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento</title>
    <link rel="icon" href="/indice/imagenes/fvicon.png" type="image/png">

</head>
<style>
    body {
    font-family: Arial, sans-serif;
    min-height: 100vh; /* Asegura que el body ocupe toda la altura de la ventana */
}

* {
    height: 100%;
    box-sizing: border-box;
}

h1 {
    color: white;
    text-align: center;
    font-size: 33px;
    padding: 20px;
}

p{
    color: black;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    padding: 20px;
}

div.azul {
    background-color: blue;
    width: 50%; /* Ajusta el ancho */
    height: 60%; /* Ajusta el largo */
    float: left;
}

div.rojo {
    background-color: rgb(255, 0, 0);
    width: 50%; /* Ajusta el ancho */
    height: 60%; /* Ajusta el largo */
    float: right;
}

div.verde {
    background-color: rgb(0, 255, 76);
    width: 50%; /* Ajusta el ancho */
    height: 60%; /* Ajusta el largo */
    clear: both;
    float: left;
}

div.amarillo {
    background-color: rgb(238, 255, 0);
    width: 50%; /* Ajusta el ancho */
    height: 60%; /* Ajusta el largo */
    float: right;
}

</style>
</head>
<body>
    <main>
        <div class="azul">
            <h1 id="inicioPagina">Posicionamiento 1 <p>Azul</p></h1>
        </div>
        <div class="rojo">
            <p>Rojo</p>
        </div>
        <div class="verde">
            <p>Verde</p>
        </div>
        <div class="amarillo">
            <p>Amarillo</p>
        </div>
    </main>
</body>

</html>
