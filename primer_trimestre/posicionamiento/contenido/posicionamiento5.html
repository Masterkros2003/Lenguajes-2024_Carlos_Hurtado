<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento</title>
    <link rel="icon" href="/indice/imagenes/fvicon.png" type="image/png">

</head>

<style>
body {
    font-family: Arial, sans-serif;
    min-height: 100vh; /* Asegura que el body ocupe toda la altura de la ventana */
}

/*//////////////////////////////////////*/
/*//////////////////////////////////////*/
/* RESETEO DE LA CONFIGURACIÓN BÁSICA */

* {
    height: 100%;
    box-sizing: border-box;
}

/* ////////////////////////////////////////// */
/* ////////////////////////////////////////// */
/* CONFIGURACIÓN DE LOS TÍTULOS Y EL TEXTO */

h1 {
    color: white;
    text-align: center;
    font-size: 33px;
    padding: 20px;
}

p{
    color: black;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    padding: 20px;
}

/*//////////////////////////////////////*/
/*//////////////////////////////////////*/
/* CONTENIDO DE LA PÁGINA WEB */ 

div.azul {
    background-color: blue;
    width: 100%;
    height: 30%;
}

/* Div gris STICKY debajo del Azul */
div.gris {
    background-color: grey;
    width: 100%;
    height: 50px; 
    position: sticky;
    top: 30%; /* Movimiento libre */
}

div.rojo {
    background-color: red;
    width: 33.33%; 
    height: 400px; 
    float: left;
}

div.verde {
    background-color: green;
    width: 33.33%; 
    height: 400px; 
    float: left;
}

div.amarillo {
    background-color: yellow;
    width: 33.33%; 
    height: 400px;
    float: left;
}

div.naranja {
    background-color: orange;
    width: 100%;
    height: 700px; 
    padding: 400px;

}

/* Div morado fijo a la derecha */
div.morado {
    background-color: purple;
    width: 100px; 
    height: 100px; 
    float: right;
    top: 50%; 
    left: 50%;
    transform: translate(-50%, 0); /* Alineación exacta en el centro */
}


</style>

<body>
    <main>
        <div class="azul">
            <h1 id="inicioPagina">Posicionamiento 5 <p>Azul</p></h1>
        </div>
        
        <div class="gris"></div> 

        <div class="rojo">
            <p>Rojo</p>
        </div>
        <div class="verde">
            <p>Verde</p>
        </div>
        <div class="amarillo">
            <p>Amarillo</p>
        </div>
        <div class="naranja">
            <p>Naranja</p>
        </div>
    </main>

    <div class="morado"></div>



</body>

</html>
