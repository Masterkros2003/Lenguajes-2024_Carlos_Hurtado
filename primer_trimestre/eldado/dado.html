}

    .contenedor {
        display: grid;
        grid-template-columns: auto auto auto;
        grid-template-rows: auto auto auto;
        width: 800px;
        height: 650px;
        margin-top: 50px;
        gap: 20px;
    }

    .cara {
        display: grid;
        grid-template-columns: auto auto auto;
        grid-template-rows: auto auto auto;
    }

    .circulo {
        width: 45px;
        height: 45px;
        background-color: black;
        border-radius: 50%;
        margin-top: 2px;
        margin-left: 2px;
    }


    .no {
        background-color: transparent;
    }

    .si {
        box-shadow: 5px 5px 5px #aaaaaa;
    }

    footer {
    text-align: center;
    margin-top: 0px;
    color: #777;
}


</style>
